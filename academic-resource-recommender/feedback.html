<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Feedback | Academic Resource Recommendation Engine</title>
  <link rel="stylesheet" href="css/common.css">
  <link rel="stylesheet" href="css/feedback.css">
</head>
<body>

  <header>
    <div class="logo">Academic Resource Recommendation Engine</div>
    <nav>
      <a href="index.html">Home</a>
      <a href="catalogue.html">Catalogue</a>
      <a href="interests.html">Interests</a>
      <a href="tags.html">Tags</a>
      <a href="recommendations.html">Recommendations</a>
      <a href="ratings.html">Ratings</a>
      <a href="bookmarks.html">Bookmarks</a>
      <a href="feedback.html" class="active">Feedback</a>
      <a href="admin.html">Admin</a>
      <a href="about.html">About</a>
    </nav>
  </header>

  <main class="container">
    <h1>Feedback</h1>
    <p class="intro">Tell us how the recommendations worked for you.</p>

    <form id="feedback-form" class="form-box">
      <label for="name">Name</label>
      <input type="text" id="name">

      <label for="email">Email (optional)</label>
      <input type="email" id="email">

      <label for="helpful">Were the recommendations helpful?</label>
      <select id="helpful">
        <option value="Yes, very helpful">Yes, very helpful</option>
        <option value="Somewhat helpful">Somewhat helpful</option>
        <option value="Not helpful">Not helpful</option>
      </select>

      <label for="feedback-text">Your feedback</label>
      <textarea id="feedback-text" placeholder="Write at least 10 characters"></textarea>

      <button type="submit">Send feedback</button>
      <p id="message" class="message"></p>
    </form>

    <h2>Feedback sent from this browser</h2>
    <div id="feedback-list"></div>
  </main>

  <footer>
    <p>Academic Resource Recommendation Engine | Group project, section K3P26CP</p>
  </footer>

  <script src="js/data.js"></script>
  <script src="js/feedback.js"></script>
</body>
</html>
